# Boundary policy for Haven's Policy Prover check.
#
# A boundary check answers: "does the candidate policy allow anything beyond
# this boundary?" This file defines the most access Haven may ever have. The
# prover compares filesystem paths one by one, so the paths here must match
# policy/policy.yaml exactly -- a different (even narrower) path returns
# `unsupported` rather than `within_boundary`.

version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /etc, /proc, /dev/urandom, /opt/openshell]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: hard_requirement

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  permitted_egress:
    name: permitted_egress
    endpoints:
      - host: api.tokenfactory.us-central1.nebius.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /v1/chat/completions }
          - allow: { method: GET, path: /v1/models }
      - host: api.tokenfactory.nebius.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /v1/chat/completions }
          - allow: { method: GET, path: /v1/models }
      - host: api.tavily.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /search }
          - allow: { method: POST, path: /extract }
    binaries:
      - path: /usr/bin/python3.12
      - path: /usr/local/bin/hermes
