# OpenShell sandbox policy for Haven.
#
# STATUS: AUTHORED AND NOT YET VERIFIED. This file has never been loaded by
# OpenShell, because OpenShell requires Linux (Landlock ABI v3, i.e. Linux
# 6.2+) plus Docker 28.0+, and the development host is Windows 11 with neither
# WSL nor Docker installed. Validate it with:
#
#     openshell-prover check policy/policy.yaml --boundary policy/boundary.yaml
#     openshell sandbox create --name haven --policy policy/policy.yaml -- /bin/bash
#
# Field shapes below follow the OpenShell Policy Schema Reference
# (docs.nvidia.com/openshell, "Policy Schema Reference"). Two deliberate
# deviations from the original design sketch are marked *HARDENED* and
# *PROVER-SAFE*.
#
# Everything not listed here is denied and returns 403, which the agent
# surfaces as a tool error.

version: 1

filesystem_policy:
  # When filesystem_policy is present, include_workdir defaults to false, so
  # the sandbox working directory must be added explicitly to stay writable.
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /etc, /proc, /dev/urandom, /opt/openshell]
  # read_write may not contain "/". /dev/null and friends are also added by
  # OpenShell's baseline paths whenever a network rule exists.
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  # *HARDENED*: the design sketch used "best_effort". OpenShell documents that
  # best_effort "runs without the filesystem rules and logs a high-severity
  # finding" when the rules cannot be applied -- which would silently void the
  # filesystem half of this policy. For a project whose claim is *provable*
  # enforcement, failing to start is the correct behaviour.
  # The Policy Prover agrees: it reports exceeds_boundary when a candidate
  # downgrades hard_requirement to best_effort.
  compatibility: hard_requirement

process:
  # Only Docker and Podman apply these, and only from the policy passed at
  # sandbox creation time. Numeric ids are also accepted; a name keeps the
  # policy readable.
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  token_factory:
    name: token_factory
    endpoints:
      # The brief mandates the regional endpoint; Nebius documents it as
      # liable to stop working if the public endpoint's processing region
      # changes. Both hosts are allowlisted so switching NEBIUS_BASE_URL is a
      # configuration change, not a policy change.
      - host: api.tokenfactory.us-central1.nebius.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /v1/chat/completions }
          - allow: { method: GET, path: /v1/models }
      - host: api.tokenfactory.nebius.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /v1/chat/completions }
          - allow: { method: GET, path: /v1/models }
    binaries:
      # *PROVER-SAFE*: list the interpreter's real path, never a symlink such
      # as /usr/bin/python3 -- OpenShell hashes the executable and matches on
      # its resolved path. Confirm on the target image with:
      #     readlink -f "$(command -v python3)"
      - path: /usr/bin/python3.12
      - path: /usr/local/bin/hermes

  tavily:
    name: tavily
    endpoints:
      - host: api.tavily.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /search }
          - allow: { method: POST, path: /extract }
    binaries:
      - path: /usr/bin/python3.12
      - path: /usr/local/bin/hermes

# This file is deliberately the *provable core*: filesystem, process, Landlock,
# and REST network rules, and nothing else. The Policy Prover models exactly
# those domains, so this policy can return `within_boundary`.
#
# A stronger runtime control -- an enforcement-layer regex middleware that
# redacts high-sensitivity patterns from allowed request bodies, fail-closed --
# lives in policy/policy.hardened.yaml. It is kept separate because the prover
# does not model `network_middlewares`, so a candidate that uses it may return
# `unsupported` (which counts as a failure) instead of `within_boundary`.
# Read policy/README.md before choosing which one to run.
