services:
  - type: web
    name: haven-family-privacy-agent
    runtime: python
    plan: free
    buildCommand: pip install "fastapi>=0.115.0" "uvicorn[standard]>=0.30.0" "jinja2>=3.1.4" "httpx>=0.27.0" "openai>=1.50.0" "python-dotenv>=1.0.1" "tavily-python>=0.7.0" "pydantic>=2.0.0" "pyyaml>=6.0.0"
    startCommand: HAVEN_HOST=0.0.0.0 python scripts/serve.py
    healthCheckPath: /api/health
    envVars:
      - key: HAVEN_PROVIDER_MODE
        value: auto
      - key: HAVEN_SCAN_RATE_LIMIT
        value: "10"
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

