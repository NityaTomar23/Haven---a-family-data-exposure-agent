[project]
name = "haven"
version = "0.1.0"
description = "Haven — a family data-exposure agent that finds where a family's personal information is publicly exposed, and drives the removal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "tavily-python>=0.7,<1.0",
    "pydantic>=2.0,<3.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "jinja2>=3.1,<4.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# src/ layout with `package = false`: make `import haven` resolve without an
# editable install, so `pytest` works from a clean checkout.
pythonpath = ["src"]
